services:
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rasayana.rule=Host(`rasayana.andrii-it.de`)"
      - "traefik.http.routers.rasayana.entrypoints=websecure"
      - "traefik.http.routers.rasayana.tls.certresolver=cfdns"
      - "traefik.http.services.rasayana.loadbalancer.server.port=80"
    restart: unless-stopped

  api:
    build:
      context: ./api
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rasayana-api.rule=Host(`rasayana.andrii-it.de`) && PathPrefix(`/api`)"
      - "traefik.http.routers.rasayana-api.entrypoints=websecure"
      - "traefik.http.routers.rasayana-api.tls.certresolver=cfdns"
      - "traefik.http.routers.rasayana-api.priority=100"
      - "traefik.http.services.rasayana-api.loadbalancer.server.port=3000"
    restart: unless-stopped
