server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssi on;
    ssi_types text/html;

    location = /assets/_nav.html { internal; }
    location = /assets/_footer.html { internal; }

    location /data/ {
        auth_basic "Rasayana Investor Data Room";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ =404;
    }

    location = /admin.html {
        auth_basic "Rasayana Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:jpg|jpeg|png|gif|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }
}
